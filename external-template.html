    .card{overflow:hidden}
    .card::after{transform:scale(0);opacity:0;transition:transform .2s ease,opacity .2s ease}
    .card:has(.open:hover)::after,.card:has(.open:focus-visible)::after{transform:scale(1);opacity:1;animation:dashboard-orb-pop .45s both}

<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" id="brandTrigger" data-view="home" type="button" aria-label="통합 홈으로 이동"><img class="mark" id="brandMark" src="data:image/png;base64,__BRAND_ICON_PAYLOAD__" alt=""><div><strong>Finance Operations</strong><small style="font-size:10px;color:#6b7789">가상 데이터 체험판</small></div></button>
      <div class="module-context" aria-label="현재 모듈"><button class="module-home" data-view="home" type="button">← 통합 홈</button><i>/</i><strong id="plainModuleTitle"></strong><details class="channel-switcher" id="channelSwitcher" hidden><summary title="대시보드 채널 선택"><strong id="channelSwitcherTitle"></strong><b id="channelBadge" hidden></b></summary><div class="channel-menu" id="channelMenu"></div></details></div>
      <nav class="module-tabs" id="moduleTabs" aria-label="모듈 전환"></nav>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="대시보드 메뉴"><p class="nav-label">WORKSPACE</p><button class="nav active" data-view="home" type="button"><span>▦</span><b>통합 홈</b></button><p class="nav-label">MODULES</p><div id="sidebarModules"></div></aside>
      <main class="content">
        <section class="home" id="homeView"><div class="home-inner"><div class="home-head"><h1>재무 운영 통합 대시보드</h1><span class="board-count" id="boardCount"></span></div><div class="cards" id="moduleCards"></div></div></section>
        <div class="viewer-host" id="viewerHost" hidden></div>
        <div class="loading" id="loading"><div><span class="spinner"></span><strong>대시보드를 준비하고 있습니다.</strong></div></div>
      </main>
    </div>
  </div>
  <section class="easter-egg-overlay" id="easterEggOverlay" role="dialog" aria-modal="true" aria-label="CTRL ALT SURVIVE" hidden><div class="easter-egg-loading" id="easterEggLoading">HIDDEN PROTOCOL LOADING…</div><button class="easter-egg-close" id="easterEggClose" type="button" aria-label="게임 닫기">×</button><iframe class="easter-egg-frame" id="easterEggFrame" title="CTRL ALT SURVIVE"></iframe></section>
  <script>
    const metadata=__EXTERNAL_METADATA__,registry=__DASHBOARD_REGISTRY__,payloads=__DASHBOARD_PAYLOADS__;
    const easterEggPayload=__EASTER_EGG_PAYLOAD__;let easterEggSource="";
    const shell=document.querySelector(".shell"),home=document.getElementById("homeView"),viewerHost=document.getElementById("viewerHost"),loading=document.getElementById("loading"),plainModuleTitle=document.getElementById("plainModuleTitle"),channelSwitcher=document.getElementById("channelSwitcher"),channelSwitcherTitle=document.getElementById("channelSwitcherTitle"),channelBadge=document.getElementById("channelBadge"),channelMenu=document.getElementById("channelMenu"),easterEggOverlay=document.getElementById("easterEggOverlay"),easterEggFrame=document.getElementById("easterEggFrame"),easterEggLoading=document.getElementById("easterEggLoading"),easterEggClose=document.getElementById("easterEggClose");
    const urls={},modules=registry.modules.filter(module=>module.channels.some(channel=>Boolean(payloads[channel.viewId]))),viewIndex=new Map();for(const module of modules)for(const channel of module.channels)if(payloads[channel.viewId])viewIndex.set(channel.viewId,{module,channel});
    const validViews=new Set(["home",...viewIndex.keys()]);let viewers={},navigationToken=0,eggClicks=[];
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[character]);}
    const dashboardIcons=__DASHBOARD_ICONS__;
    function moduleIcon(icon){return dashboardIcons[icon]?`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline-block;vertical-align:middle"><path d="${escapeHtml(dashboardIcons[icon])}"/></svg>`:escapeHtml(icon);}
    function defaultView(module){return module.channels.find(channel=>payloads[channel.viewId])?.viewId;}
    function channelButtons(module,className=""){return module.channels.filter(channel=>payloads[channel.viewId]).map(channel=>`<button class="${className}" data-open="${escapeHtml(channel.viewId)}" type="button"><span>${escapeHtml(channel.badge)}</span><strong>${escapeHtml(channel.label)}</strong><small>${escapeHtml(channel.description)}</small></button>`).join("");}
    function renderNavigation(){
      document.getElementById("moduleTabs").innerHTML=`<button class="module-tab" data-view="home" type="button"><span aria-hidden="true">⌂</span> 통합 홈</button>`+modules.map(module=>`<button class="module-tab" data-module-id="${escapeHtml(module.id)}" data-view="${escapeHtml(defaultView(module))}" type="button">${escapeHtml(module.title)}</button>`).join("");
      document.getElementById("sidebarModules").innerHTML=modules.map(module=>`<button class="nav" data-module-id="${escapeHtml(module.id)}" data-view="${escapeHtml(defaultView(module))}" style="--accent:${escapeHtml(module.accentColor)}" type="button"><span>${moduleIcon(module.icon)}</span><b>${escapeHtml(module.title)}</b><small>LIVE</small></button>`).join("");
      document.getElementById("moduleCards").innerHTML=modules.map((module,index)=>{const channels=module.channels.filter(channel=>payloads[channel.viewId]),icon=channels.length>1?`<details class="card-channel-entry"><summary class="card-icon" title="${escapeHtml(module.title)} 채널 선택">${moduleIcon(module.icon)}</summary><div class="card-channel-menu">${channelButtons(module)}</div></details>`:`<span class="card-icon">${moduleIcon(module.icon)}</span>`;return `<article class="card" style="--card-accent:${escapeHtml(module.accentColor)}"><div class="card-top">${icon}<span class="card-index">${String(index+1).padStart(2,"0")}</span></div><h2>${escapeHtml(module.title)}</h2><p>${escapeHtml(module.externalDescription)}</p><button class="open" data-open="${escapeHtml(defaultView(module))}" type="button">열기 →</button></article>`;}).join("");
      viewerHost.innerHTML=[...viewIndex].map(([view,{module,channel}])=>`<iframe class="viewer" id="viewer-${escapeHtml(view)}" data-module="${escapeHtml(view)}" title="${escapeHtml(module.title)} ${escapeHtml(channel.label)} 대시보드"></iframe>`).join("");
      viewers=Object.fromEntries([...viewIndex.keys()].map(view=>[view,document.getElementById(`viewer-${view}`)]));
      document.getElementById("boardCount").textContent=`${modules.length}개 보드`;
      document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.view)));
      document.querySelectorAll("[data-open]").forEach(button=>button.addEventListener("click",()=>{button.closest("details")?.removeAttribute("open");navigate(button.dataset.open);}));
    }
    function setActive(view){const current=viewIndex.get(view),moduleId=current?.module.id??"";document.querySelectorAll("[data-view]").forEach(button=>{const active=view==="home"?button.dataset.view==="home":button.dataset.moduleId===moduleId;button.classList.toggle("active",active);button.setAttribute("aria-current",active?"page":"false");});}
    function bytesFromBase64(value){const decoded=atob(value),bytes=new Uint8Array(decoded.length);for(let index=0;index<decoded.length;index+=1)bytes[index]=decoded.charCodeAt(index);return bytes;}
    async function moduleUrl(view){if(urls[view])return urls[view];if(!payloads[view])throw new Error("선택한 대시보드 데이터가 전달본에 없습니다.");if(typeof DecompressionStream!=="function")throw new Error("이 전달본은 최신 Chrome 또는 Edge에서 열어 주세요.");const stream=new Blob([bytesFromBase64(payloads[view])]).stream().pipeThrough(new DecompressionStream("gzip")),source=await new Response(stream).text();urls[view]=source;return urls[view];}
    function viewFromLocation(){const view=location.hash.slice(1);return validViews.has(view)?view:"home";}
    function navigate(view,{replace=false}={}){const target=validViews.has(view)?view:"home",hash=`#${target}`;if(location.hash===hash){void renderView(target);return;}if(replace){history.replaceState(null,"",hash);void renderView(target);return;}location.hash=target;}
    function renderChannelContext(module,activeChannel){const channels=module.channels.filter(channel=>payloads[channel.viewId]);plainModuleTitle.hidden=channels.length>1;channelSwitcher.hidden=channels.length<=1;plainModuleTitle.textContent=module.title;channelSwitcherTitle.textContent=module.title;channelBadge.hidden=activeChannel.id===channels[0].id;channelBadge.textContent=activeChannel.badge;channelMenu.innerHTML=channelButtons(module,"channel-option");channelMenu.querySelectorAll("[data-open]").forEach(button=>{button.classList.toggle("active",button.dataset.open===activeChannel.viewId);button.addEventListener("click",()=>{channelSwitcher.removeAttribute("open");navigate(button.dataset.open);});});}
    function hasOpenOverlay(sourceDocument){if(!sourceDocument)return false;const nodes=sourceDocument.querySelectorAll('dialog[open],[role="dialog"][aria-modal="true"]:not([hidden]),.modal.active,.modal.show,.drawer.open,.drawer.active,.overlay.active');return Array.from(nodes).some(node=>{const style=sourceDocument.defaultView?.getComputedStyle(node);return !style||style.display!=="none"&&style.visibility!=="hidden";});}
    function closeEasterEgg(){easterEggOverlay.hidden=true;easterEggFrame.srcdoc="";easterEggFrame.src="about:blank";easterEggLoading.hidden=false;}
    async function openEasterEgg(){easterEggOverlay.hidden=false;easterEggLoading.hidden=false;easterEggClose.focus();try{if(!easterEggSource)easterEggSource=new TextDecoder("utf-8").decode(bytesFromBase64(easterEggPayload));easterEggFrame.addEventListener("load",()=>{easterEggLoading.hidden=true;attachViewerShortcuts(easterEggFrame);},{once:true});easterEggFrame.srcdoc=easterEggSource;}catch(error){easterEggLoading.textContent=`게임을 열 수 없습니다: ${String(error.message||error)}`;}}
    function handleEscape(event,sourceDocument=document){if(event.key!=="Escape")return;if(!easterEggOverlay.hidden){closeEasterEgg();return;}if(viewFromLocation()==="home"||hasOpenOverlay(sourceDocument))return;navigate("home");}
    function attachViewerShortcuts(frame){try{frame.contentWindow?.addEventListener("keydown",event=>handleEscape(event,frame.contentDocument),true);}catch{}}
    async function renderView(view){const token=++navigationToken;setActive(view);const current=viewIndex.get(view),isModule=Boolean(current);shell.classList.toggle("module-mode",isModule);Object.entries(viewers).forEach(([key,frame])=>frame.classList.toggle("active",key===view));if(!isModule){shell.style.setProperty("--accent","#2f3033");loading.classList.remove("active");home.hidden=false;viewerHost.hidden=true;channelSwitcher.hidden=true;document.title="재무 운영 통합 대시보드 · 외부전달용";return;}const {module,channel}=current;shell.style.setProperty("--accent",module.accentColor);renderChannelContext(module,channel);document.title=`${module.title}${channel.id===module.channels[0].id?"":` · ${channel.badge}`} · 재무 운영 통합 대시보드`;home.hidden=true;viewerHost.hidden=false;const viewer=viewers[view];if(viewer.dataset.state==="loaded"){loading.classList.remove("active");return;}loading.classList.add("active");loading.innerHTML='<div><span class="spinner"></span><strong>대시보드를 준비하고 있습니다.</strong></div>';if(viewer.dataset.state==="loading")return;try{const url=await moduleUrl(view);if(token!==navigationToken)return;viewer.dataset.state="loading";viewer.addEventListener("load",()=>{viewer.dataset.state="loaded";attachViewerShortcuts(viewer);if(viewFromLocation()===view)loading.classList.remove("active");},{once:true});viewer.srcdoc=url;}catch(error){loading.innerHTML=`<div class="error"><strong>대시보드를 열 수 없습니다.</strong><br>${String(error.message||error)}</div>`;}}
    renderNavigation();
    document.getElementById("brandTrigger").addEventListener("click",()=>{if(viewFromLocation()!=="home"){eggClicks=[];return;}const now=performance.now();eggClicks=eggClicks.filter(clickedAt=>now-clickedAt<=3000);eggClicks.push(now);if(eggClicks.length>=5){eggClicks=[];void openEasterEgg();}});
    easterEggClose.addEventListener("click",closeEasterEgg);document.addEventListener("keydown",event=>handleEscape(event));addEventListener("hashchange",()=>void renderView(viewFromLocation()));addEventListener("beforeunload",()=>Object.values(urls).forEach(url=>URL.revokeObjectURL(url)));
    const initial=viewFromLocation();if(location.hash!==`#${initial}`)history.replaceState(null,"",`#${initial}`);void renderView(initial);
  </script>
