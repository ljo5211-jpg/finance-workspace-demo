<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="가상 데이터로 체험하는 채권·외화·건설중인자산 재무 대시보드. 실제 회사 자료와 연결되지 않습니다.">
  <meta name="theme-color" content="#20242b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Finance Workspace · 재무 대시보드 체험판</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="#home"><img src="./favicon.svg" alt="" width="34" height="34"><span>Finance Workspace<small>재무 운영 통합 대시보드</small></span></a><span class="demo-badge">PUBLIC DEMO · 가상 데이터</span></header>
  <div class="workspace"><aside><p class="eyebrow">WORKSPACE</p><nav id="navigation" aria-label="업무 탐색"></nav><div class="sidebar-note">실제 회사 자료 없음<br>로그인·서버 연결 없음</div></aside><main id="main" tabindex="-1"></main></div>
  <div class="activity"><details id="activity"><summary><span id="activityLabel">체험 준비 완료</span><span>진행률·작업 로그</span></summary><progress id="progress" max="100" value="0" aria-label="체험 작업 진행률"></progress><ol id="logs" aria-live="polite"><li>모든 수치는 가상으로 생성했습니다. 입력·조정은 현재 화면에서만 유지됩니다.</li></ol></details></div>
  <dialog id="detail"><form method="dialog"><button class="icon-close" aria-label="상세 닫기">×</button></form><div id="detailBody"></div></dialog>
</body>
</html>
